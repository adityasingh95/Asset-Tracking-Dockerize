spring.application.name=asset-tracking

# Datasource (local dev defaults; overridden by environment variables in Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/asset_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Single in-memory demo user (no roles)
spring.security.user.name=admin
spring.security.user.password=admin123

server.port=8080
