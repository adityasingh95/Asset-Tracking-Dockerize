<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Asset Tracking — Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
        }
        .card {
            width: 360px;
            padding: 40px 32px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: #fff;
        }
        h1 { margin: 0 0 24px; font-size: 22px; text-align: center; }
        label { display: block; margin: 14px 0 6px; font-size: 13px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.85);
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #2d2a55;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #3d3a75; }
        .msg { margin-top: 16px; text-align: center; font-size: 13px; }
        .error { color: #ffd2d2; }
        .info { color: #d2ffd9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Asset Tracking System</h1>
        <form th:action="@{/auth/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus/>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"/>

            <button type="submit">Sign in</button>
        </form>
        <div class="msg error" th:if="${param.error}">Invalid username or password.</div>
        <div class="msg info" th:if="${param.logout}">You have been logged out.</div>
    </div>
</body>
</html>
