<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Asset Tracking — Edit Asset</title>
    <style>
        body {
            margin: 0; min-height: 100vh;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            width: 420px; padding: 32px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        h1 { margin-top: 0; font-size: 20px; }
        label { display: block; margin: 14px 0 6px; font-size: 13px; color: #444; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; }
        .row { margin-top: 24px; display: flex; gap: 12px; }
        button, a.back {
            padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 14px; text-decoration: none; display: inline-block;
        }
        button { background: #2d2a55; color: #fff; }
        a.back { background: #ddd; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Edit Asset</h1>
        <!-- Display-only view. Inline edits are performed from the dashboard via PATCH. -->
        <label>ID</label>
        <input type="text" th:value="${asset.id}" readonly/>

        <label>Name</label>
        <input type="text" id="name" th:value="${asset.name}"/>

        <label>Type</label>
        <input type="text" id="type" th:value="${asset.type}"/>

        <label>Status</label>
        <input type="text" id="status" th:value="${asset.status}"/>

        <div class="row">
            <button type="button" th:attr="onclick=|saveAsset(${asset.id})|">Save</button>
            <a class="back" th:href="@{/assets-ui}">Back to dashboard</a>
        </div>
    </div>

    <script>
        function saveAsset(id) {
            const payload = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                status: document.getElementById('status').value
            };
            fetch('/assets/' + id, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => {
                if (!r.ok) throw new Error('Update failed');
                window.location.href = '/assets-ui';
            }).catch(err => alert(err.message));
        }
    </script>
</body>
</html>
