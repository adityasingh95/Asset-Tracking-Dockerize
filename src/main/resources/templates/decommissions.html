<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Asset Tracking — Pending Decommission Requests</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 32px;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3); color: #222;
        }
        header { display: flex; justify-content: space-between; align-items: center; color: #fff; margin-bottom: 24px; }
        header h1 { margin: 0; font-size: 22px; }
        .toolbar-link { color: #fff; text-decoration: underline; font-size: 14px; }
        .panel {
            background: rgba(255, 255, 255, 0.9); border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); padding: 24px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e3e3ef; vertical-align: top; }
        th { font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: .04em; }
        .comment-input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; width: 150px; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; color: #fff; }
        .btn-approve { background: #2e7d32; }
        .btn-reject { background: #c62828; }
        .flash { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .flash-error { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
        .empty { color: #666; font-style: italic; }
        .muted { color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>Pending Decommission Requests</h1>
        <a class="toolbar-link" th:href="@{/assets-ui}">← Back to dashboard</a>
    </header>

    <div class="flash flash-success" th:if="${message}" th:text="${message}"></div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>

    <div class="panel">
        <p class="empty" th:if="${#lists.isEmpty(pending)}">No pending decommission requests.</p>

        <table th:unless="${#lists.isEmpty(pending)}">
            <thead>
                <tr>
                    <th>Req #</th>
                    <th>Asset</th>
                    <th>Type</th>
                    <th>Requested by</th>
                    <th>Reason</th>
                    <th>Requested at</th>
                    <th>Decision</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${pending}">
                    <td th:text="${req.id}">1</td>
                    <td th:text="${assetsById.containsKey(req.assetId)} ? ${assetsById.get(req.assetId).name} : ('#' + ${req.assetId})">Asset</td>
                    <td th:text="${assetsById.containsKey(req.assetId)} ? ${assetsById.get(req.assetId).type} : '—'">Type</td>
                    <td th:text="${req.requestedBy}">admin</td>
                    <td th:text="${req.reason}">reason</td>
                    <td class="muted" th:text="${req.requestedAt}">time</td>
                    <td>
                        <!-- Approve: optional comment (UI-05) -->
                        <form th:action="@{'/assets-ui/decommissions/' + ${req.id} + '/approve'}"
                              method="post" style="display:inline;">
                            <input class="comment-input" type="text" name="comment" placeholder="Comment (optional)"/>
                            <button type="submit" class="btn btn-approve"
                                    onclick="return confirm('Approve and decommission this asset?');">Approve</button>
                        </form>
                        <!-- Reject: comment required (UI-05) -->
                        <form th:action="@{'/assets-ui/decommissions/' + ${req.id} + '/reject'}"
                              method="post" style="display:inline; margin-left:6px;">
                            <input class="comment-input" type="text" name="comment" placeholder="Reason to reject" required/>
                            <button type="submit" class="btn btn-reject">Reject</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
